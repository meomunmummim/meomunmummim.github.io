<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Build Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg: #0f1b2d;
  --panel: #16263d;
  --line: #2a3f5c;
  --ink: #dfe8f5;
  --ink-dim: #8ea3c2;
  --amber: #e8a13a;
  --amber-dim: #6b5326;
  --done: #4fb787;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 100%,
    var(--bg);
  background-blend-mode: overlay, overlay, normal;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  padding: 32px 16px 80px;
}

.wrap{ max-width: 820px; margin: 0 auto; }

header{ margin-bottom: 28px; }
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 3px; color: var(--amber); text-transform: uppercase;
}
h1{
  font-family:'JetBrains Mono', monospace;
  font-size: clamp(26px, 5vw, 38px);
  margin: 6px 0 8px; color: #fff; letter-spacing: -0.5px;
}
.sub{ color: var(--ink-dim); font-size: 14px; max-width: 60ch; line-height:1.5; }

.progress-shell{
  margin-top: 20px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px;
}
.progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.progress-label{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim); }
.progress-num{ font-family:'JetBrains Mono', monospace; font-size:20px; color:var(--amber); font-weight:700; }
.bar-track{ height:8px; border-radius:6px; background:#0b1524; overflow:hidden; border:1px solid var(--line); }
.bar-fill{ height:100%; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); width:0%; transition: width .4s ease; }

.section{ border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 16px; overflow: hidden; }
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 16px; cursor:pointer; user-select:none; border-bottom: 1px solid transparent;
}
.section-head:hover{ background: rgba(255,255,255,0.02); }
.section.open .section-head{ border-bottom-color: var(--line); }
.section-title{ display:flex; align-items:center; gap:10px; }
.tag{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--bg); background: var(--amber); padding: 2px 7px; border-radius: 5px; font-weight:700; }
.section-name{ font-family:'JetBrains Mono', monospace; font-size: 15px; color:#fff; }
.section-meta{ display:flex; align-items:center; gap:12px; }
.mini-count{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--ink-dim); }
.chev{ color: var(--ink-dim); transition: transform .25s ease; font-size:12px; }
.section.open .chev{ transform: rotate(90deg); }

.section-body{ max-height:0; overflow:hidden; transition: max-height .4s ease; }
.section.open .section-body{ max-height: 6000px; }

.item{ padding: 12px 16px 14px 20px; border-top: 1px dashed var(--line); }
.item:first-child{ border-top:none; }
.item-title{ font-weight:700; font-size:14.5px; color: #fff; margin-bottom:8px; }

.step{ display:flex; gap:10px; align-items:flex-start; padding: 4px 0 4px 4px; }
.step input[type=checkbox]{
  appearance:none; -webkit-appearance:none; width:15px; height:15px; min-width:15px; margin-top:3px;
  border: 1.5px solid var(--ink-dim); border-radius:4px; background: #0b1524; cursor:pointer; position:relative;
}
.step input[type=checkbox]:checked{ background: var(--done); border-color: var(--done); }
.step input[type=checkbox]:checked::after{
  content:''; position:absolute; left:4px; top:1px; width:4px; height:7px;
  border:solid #06140c; border-width:0 2px 2px 0; transform: rotate(40deg);
}
.step label{ cursor:pointer; font-size:13px; color: var(--ink); line-height:1.4; }
.step.done label{ color: var(--ink-dim); text-decoration: line-through; text-decoration-color: rgba(79,183,135,0.5); }

.benchmark{
  margin-top:8px; padding: 8px 10px; background: rgba(232,161,58,0.07);
  border-left: 2px solid var(--amber); border-radius: 4px;
  font-size: 12.5px; color: #f0d9ae; line-height:1.5;
}
.benchmark b{ color: var(--amber); font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.5px; }

footer{
  max-width:820px; margin: 24px auto 0; display:flex; justify-content:space-between; align-items:center;
  font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--ink-dim);
}
button#reset{
  font-family:'JetBrains Mono', monospace; font-size:12px; background:none; border:1px solid var(--line);
  color: var(--ink-dim); padding:7px 12px; border-radius:7px; cursor:pointer;
}
button#reset:hover{ border-color: var(--amber); color: var(--amber); }
#status{ font-size:11px; color: var(--ink-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">// personal build log</div>
    <h1>Agent Build Log</h1>
    <div class="sub">Every task is broken into small steps with a benchmark — the real test that tells you it's actually done, not just "read about it". Tick steps as you go; progress saves automatically.</div>
    <div class="progress-shell">
      <div class="progress-row">
        <span class="progress-label">OVERALL PROGRESS</span>
        <span class="progress-num" id="overallNum">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="overallBar"></div></div>
    </div>
  </header>

  <div id="sections"></div>

  <footer>
    <span id="status">loading…</span>
    <button id="reset">Reset all checkmarks</button>
  </footer>
</div>

<script>
// Each item: [ title, [step1, step2, ...], benchmark ]
const SECTIONS = [
{ id:'tools-core', tag:'01', title:'Core Tools', items:[
  ['Git', ['Install Git and set your name/email with git config','Run git init in a test folder','Make a file, git add + commit it','Create a GitHub repo and push to it','Change a file on GitHub, then git pull locally','Create a branch, edit it, merge it back'],
    'Close this page, create a brand-new repo, and push a change from scratch — add, commit, push, pull, one branch and merge — with no lookups.'],
  ['GitHub', ['Create a free GitHub account','Push a local repo to GitHub','Open a pull request on a practice repo','Read and understand a diff in someone else\'s PR'],
    'You can open any public PR and explain in one sentence what it changes.'],
  ['Python', ['Write a script using functions','Write a small class','Wrap risky code in try/except','Create a venv and pip install a package inside it'],
    'You can build a small script (e.g. a to-do list) using functions, a class, and error handling, run inside a venv.'],
  ['Linux / Ubuntu', ['Practice cd, ls, mv, cp, rm, mkdir','Install a package with apt','Change file permissions with chmod'],
    'You can install a tool, move into its folder, and fix its permissions using only the terminal.'],
  ['VS Code', ['Install VS Code + Python extension','Set a breakpoint and run the debugger','Use the integrated terminal to run a script'],
    'You can pause a running script at a breakpoint and inspect a variable\'s value.'],
  ['SQL + PostgreSQL', ['Install Postgres (or run it via Docker)','Create a table and insert rows','Write a SELECT with WHERE','Write a query that JOINs two tables'],
    'You can design a 2-table schema and write a query that joins them correctly.'],
  ['REST API / HTTP', ['Learn GET vs POST vs PUT vs DELETE','Call a public API from Python with requests','Explain status codes 200, 404, 500'],

  ['JSON', ['Load a JSON file with json.load','Convert a dict to JSON with json.dumps','Pull a nested field out of a JSON response'],
    'Given an API response, you can extract a specific nested value without searching for how.'],
  ['Docker + Compose', ['Write a Dockerfile for a simple script','Build and run the image','Write a docker-compose.yml with 2 services'],
    'You can start your app and a database together with one docker compose up command.'],
  ['Env vars & secrets', ['Create a .env file','Add .env to .gitignore','Load env vars in Python with os.environ or python-dotenv'],
    'Your API key works in the app but never appears anywhere in your Git history.'],
  ['pytest', ['Install pytest','Write one test function with assert','Run pytest and read the output'],
    'You can write a test that fails on purpose, understand why, then fix the code so it passes.'],
  ['Logging & debugging', ['Replace a print() with logging.info()','Set logging levels (DEBUG/INFO/ERROR)','Use logs to trace and fix one real bug'],

{ id:'tools-ai', tag:'02', title:'AI Stack', items:[
  ['LLM APIs', ['Get an API key','Send one chat completion request','Print and read the response text'],
    'You can send a message to an LLM API from Python and get a reply, with no tutorial open.'],
  ['Embeddings', ['Call an embeddings endpoint on 2 sentences','Compute cosine similarity between them','Compare a similar pair vs an unrelated pair'],
    'You can explain, in your own words, why similar sentences get closer vectors than unrelated ones.'],
  ['Vector database', ['Install a local vector DB (e.g. Chroma)','Insert a few embedded documents','Query for the nearest match'],
    'You can store 10 text snippets and retrieve the most relevant one for a new query.'],
  ['Agent framework', ['Install LangGraph (or similar)','Build a 2-node graph: input → LLM → output','Add one conditional branch'],

  ['RAG', ['Chunk a text document','Embed and store the chunks','Retrieve chunks and feed them into a prompt'],

    'The agent remembers something you told it yesterday, in a brand-new conversation today.'],

    'You have a script that scores your agent\'s answers automatically, not by eyeballing them.'],

  ['Linux server / VPS', ['Rent a small VPS','SSH into it','Update packages with apt'],
    'SSH-ing into your own server feels routine, not scary.'],
  ['Cloudflare', ['Add your domain to Cloudflare','Point an A record at your server IP','Wait for DNS to propagate and test it'],

  ['Reverse proxy', ['Install nginx or Caddy','Point it at your app\'s local port','Restart and test in a browser'],

    'Your site loads with a padlock and no browser warning.'],

    'You can reboot the server and the app comes back up by itself.'],
  ['Monitoring', ['Add a /health endpoint','Set up an uptime checker','Get notified when it goes down'],
    'You get an alert within minutes of your app going down, without checking manually.'],
]},
{ id:'concepts-agents', tag:'04', title:'AI Agents (core concept)', items:[
  ['Agent loop', ['Sketch the loop: input → decide → act → observe → respond','Implement it as a loop in code','Add a stop condition'],
    'Your agent can take more than one step to answer a question, not just a single LLM call.'],
  ['Tool selection', ['Give the agent 2+ tools','Ask a question that needs only one of them','Confirm it picks the right tool'],
    'The agent correctly ignores tools it doesn\'t need for a given question.'],
  ['Planning', ['Ask a multi-part question','Have the model list its steps first','Execute the steps one by one'],
    'You can see the agent\'s plan before it acts, and it roughly matches what it actually does.'],
  ['State', ['Store what\'s been done so far','Pass that state into the next step','Print state after each step to check it'],
    'You can pause mid-task and know exactly what the agent has and hasn\'t done yet.'],
  ['Human-in-the-loop', ['Flag one action as risky','Pause and ask for confirmation','Only proceed after a yes'],
    'The agent asks permission before doing something irreversible, like sending a message.'],
  ['Failure recovery', ['Force a tool call to fail on purpose','Catch the error','Retry once or fall back gracefully'],
    'A failed tool call doesn\'t crash your whole agent.'],
  ['Guardrails', ['List things the agent must never do','Block those actions in code, not just the prompt','Test that it actually gets blocked'],
    'You ask the agent to do a forbidden action and code — not just politeness — stops it.'],
]},
{ id:'concepts-memory', tag:'05', title:'Memory Design', items:[
  ['Short-term memory', ['Keep the last N messages','Pass them into every new request','Test it remembers earlier in the same chat'],
    'The agent correctly answers "what did I just ask you" mid-conversation.'],
  ['Long-term memory', ['Pick one fact worth saving','Write it to a database','Load it back in a new session'],
    'You close the app, reopen it, and the fact is still there.'],
  ['Episodic memory', ['Log each conversation with a timestamp','Store a short summary of it','Search past summaries by date'],
    'You can ask "what did we talk about last Tuesday" and get a real answer.'],
  ['Semantic memory', ['Extract one user preference from chat','Store it separately from raw history','Use it to personalize a later answer'],
    'The agent adapts a suggestion based on something you told it once, weeks ago.'],
  ['Working memory', ['Track the current goal in a variable','Update it as the task changes','Clear it once the task is done'],
    'The agent doesn\'t lose track of the original request halfway through a multi-step task.'],
]},
{ id:'security', tag:'06', title:'Security', items:[
  ['.env & secret management', ['Store keys in .env','Add .gitignore','Confirm none show up in git log -p'],
    'Searching your repo history for the key finds nothing.'],
  ['OAuth & JWT basics', ['Read how a login token works','Decode a JWT online to see its payload','Implement a basic login with a library'],
    'You can explain, in plain words, what\'s inside a JWT to someone else.'],
  ['Least privilege', ['List what each tool/key can access','Cut access it doesn\'t need','Use separate keys per service'],
    'If one tool\'s key leaked, the damage would be limited, not total.'],
  ['Input validation', ['Check input length/type before use','Reject bad input before it reaches the LLM','Test with weird or broken input'],
    'Pasting garbage or huge text doesn\'t break or crash your agent.'],
  ['Prompt injection awareness', ['Read a real prompt-injection example','Try injecting your own agent via a fetched webpage','Add a rule ignoring instructions inside external content'],
    'Your agent doesn\'t follow a fake instruction hidden inside a webpage it reads.'],
  ['Sandboxing', ['Run code execution in a restricted environment','Limit file system access','Set a timeout on execution'],
    'A runaway or malicious script can\'t touch files outside its sandbox.'],
  ['Rate limiting', ['Add a request counter per user','Reject requests over the limit','Test that it actually blocks you'],
    'Spamming your own endpoint gets blocked instead of racking up API cost.'],
]},
{ id:'testing', tag:'07', title:'Testing & Evaluation', items:[
  ['Unit & integration tests', ['Write a unit test for one function','Write an integration test hitting your API','Run both with pytest'],
    'You have at least 5 passing tests you can run with one command.'],
  ['End-to-end tests', ['Simulate a full user request start to finish','Assert on the final output','Run it after every change'],
    'You\'d notice immediately if a change broke the whole flow, not just one piece.'],
  ['LLM-as-a-judge', ['Write a grading prompt','Feed it your agent\'s answer','Get a pass/fail or score back'],
    'You can grade 10 answers automatically instead of reading each one yourself.'],
  ['RAG evaluation', ['Write questions with known correct source docs','Check if retrieval pulls the right doc','Check if the answer matches it'],
    'You can measure, as a percentage, how often retrieval finds the right document.'],
  ['Tool-call accuracy', ['Write test cases with expected tool + args','Run the agent','Compare actual vs expected call'],
    'You know your agent\'s tool-call accuracy as a number, not a feeling.'],
  ['Regression test set', ['Save 10+ question/expected-answer pairs','Re-run them after every change','Track results over time'],
    'You\'d catch it immediately if a new feature accidentally broke an old one.'],
]},
{ id:'phases', tag:'08', title:'Build Phases (do in order)', items:[
  ['Phase 1 — Basic assistant', ['Create a Discord bot and get its token','Connect the bot to an LLM API','Send a message and get a reply back'],
    'You can message your Discord bot and get an LLM-generated reply.'],
  ['Phase 2 — Tool calling', ['Add a calculator tool','Add a web search tool','Confirm the agent picks the right tool per question'],
    'Your bot correctly uses a tool instead of guessing, for at least 2 tool types.'],
  ['Phase 3 — Memory', ['Set up PostgreSQL','Save each conversation to it','Retrieve past facts in new sessions'],
    'The bot remembers something from a conversation days ago.'],
  ['Phase 4 — RAG', ['Chunk your own notes','Embed and store them','Answer a question using only retrieved chunks'],
    'The bot correctly answers a personal question using your own documents.'],
  ['Phase 5 — Agent architecture', ['Build a router node','Connect it to 2+ specialized paths','Add retries / error handling'],
    'A single request can flow through multiple nodes and still recover from one failure.'],
  ['Phase 6 — Background agents', ['Set up a scheduler (cron or similar)','Write a "morning briefing" job','Send the result to Discord automatically'],
    'You wake up to a message your agent sent itself, with no manual trigger.'],
  ['Phase 7 — Production engineering', ['Put every service in docker-compose','Add healthchecks','Deploy to your VPS'],
    'docker compose up -d on the server brings up the whole system with one command.'],
  ['Phase 8 — Observability', ['Log tokens used and cost per request','Log latency per request','Build a tiny dashboard or daily summary'],
    'You can answer "how much did yesterday cost me" in under a minute.'],
  ['Phase 9 — Security hardening', ['Try to prompt-inject your own agent','Try to leak a secret through it','Fix whatever breaks'],
    'Your own attack attempts fail against your own agent.'],
  ['Phase 10 — Voice', ['Add speech-to-text input','Add text-to-speech output','Test a full spoken round trip'],
    'You can talk to your agent out loud and hear it talk back.'],
]},
];

const root = document.getElementById('sections');
const state = {};

function stepKey(sectionId, itemIdx, stepIdx){ return 'step:' + sectionId + ':' + itemIdx + ':' + stepIdx; }

function render(){
  root.innerHTML = '';
  let totalDone = 0, totalAll = 0;

  SECTIONS.forEach((sec, sIdx) => {
    const secEl = document.createElement('div');
    secEl.className = 'section' + (sIdx === 0 ? ' open' : '');

    let secDone = 0, secAll = 0;
    sec.items.forEach(it => { secAll += it[1].length; });
    sec.items.forEach((it, iIdx) => {
      it[1].forEach((_, stIdx) => { if(state[stepKey(sec.id, iIdx, stIdx)]) secDone++; });
    });
    totalDone += secDone; totalAll += secAll;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <div class="section-title">
        <span class="tag">${sec.tag}</span>
        <span class="section-name">${sec.title}</span>
      </div>
      <div class="section-meta">
        <span class="mini-count">${secDone}/${secAll} steps</span>
        <span class="chev">▶</span>
      </div>`;
    head.addEventListener('click', () => secEl.classList.toggle('open'));

    const body = document.createElement('div');
    body.className = 'section-body';

    sec.items.forEach((it, iIdx) => {
      const [title, steps, benchmark] = it;
      const itemEl = document.createElement('div');
      itemEl.className = 'item';

      const titleEl = document.createElement('div');
      titleEl.className = 'item-title';
      titleEl.textContent = title;
      itemEl.appendChild(titleEl);

      steps.forEach((stepText, stIdx) => {
        const key = stepKey(sec.id, iIdx, stIdx);
        const checked = !!state[key];
        const row = document.createElement('div');
        row.className = 'step' + (checked ? ' done' : '');
        const cbId = 'cb-' + sec.id + '-' + iIdx + '-' + stIdx;
        row.innerHTML = `<input type="checkbox" id="${cbId}" ${checked ? 'checked' : ''}>
          <label for="${cbId}">${stepText}</label>`;
        const cb = row.querySelector('input');
        cb.addEventListener('change', async () => {
          state[key] = cb.checked;
          row.classList.toggle('done', cb.checked);
          await save(key, cb.checked);
          render();
        });
        itemEl.appendChild(row);
      });

      const bm = document.createElement('div');
      bm.className = 'benchmark';
      bm.innerHTML = `<b>BENCHMARK</b><br>${benchmark}`;
      itemEl.appendChild(bm);

      body.appendChild(itemEl);
    });

    secEl.appendChild(head);
    secEl.appendChild(body);
    root.appendChild(secEl);
  });

  const pct = totalAll ? Math.round((totalDone / totalAll) * 100) : 0;
  document.getElementById('overallNum').textContent = pct + '%';
  document.getElementById('overallBar').style.width = pct + '%';
}

// 1. SAVE: Store the checkmark in the browser
async function save(key, value){
  try {
    localStorage.setItem(key, JSON.stringify(value));
    document.getElementById('status').textContent = 'saved';
  } catch(e) {
    document.getElementById('status').textContent = 'save failed';
    console.error(e);
  }
}

// 2. LOAD: Read the checkmarks when you open the page
async function loadAll(){
  const status = document.getElementById('status');
  try {
    const keys = [];
    SECTIONS.forEach(sec => sec.items.forEach((it, iIdx) => it[1].forEach((_, stIdx) => keys.push(stepKey(sec.id, iIdx, stIdx)))));
    
    for(const key of keys){
      const res = localStorage.getItem(key);
      if(res !== null) {
        state[key] = JSON.parse(res);
      }
    }
    status.textContent = 'progress loaded';
  } catch(e) {
    status.textContent = 'could not load saved progress';
    console.error(e);
  }
  render();
}

// 3. RESET: Delete all checkmarks when the button is clicked
document.getElementById('reset').addEventListener('click', async () => {
  if(!confirm('Clear every checkmark? This cannot be undone.')) return;
  const keys = [];
  SECTIONS.forEach(sec => sec.items.forEach((it, iIdx) => it[1].forEach((_, stIdx) => keys.push(stepKey(sec.id, iIdx, stIdx)))));
  
  for(const key of keys){
    delete state[key];
    localStorage.removeItem(key);
  }
  render();
});

loadAll();
</script>
</body>
</html>
